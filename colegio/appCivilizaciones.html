    // --- AUDIO SYSTEM ---
    const playSound = (type) => {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      if (type === 'correct') {
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.5);
      } else if (type === 'incorrect') {
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
        oscillator.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.3);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'win') {
        oscillator.type = 'square';
        oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); 
        oscillator.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.15); 
        oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3); 
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime + 0.45); 
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.8);
      }
    };

    // --- HELPER FUNC ---
    const shuffleArray = (array) => {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    // --- MAIN APP COMPONENT ---
    const App = () => {
      const [view, setView] = React.useState('menu'); // menu, study, quiz, results
      const [studyTopic, setStudyTopic] = React.useState(null);
      const [quizTopic, setQuizTopic] = React.useState(null);
      
      // Quiz State
      const [questions, setQuestions] = React.useState([]);
      const [currentQIndex, setCurrentQIndex] = React.useState(0);
      const [userAnswers, setUserAnswers] = React.useState([]);
      const [score, setScore] = React.useState(0);
      const [showFeedback, setShowFeedback] = React.useState(false);
      const [selectedOption, setSelectedOption] = React.useState(null);

      // Actions
      const startStudy = (topic) => {
        setStudyTopic(topic);
        setView('study');
        window.scrollTo(0,0);
      };

      const startQuiz = (topic) => {
        setQuizTopic(topic);
        const bank = quizBanks[topic];
        // Shuffle questions and options
        const shuffledQuestions = shuffleArray(bank).slice(0, 30); // Use 30 for the exam
        const preparedQuestions = shuffledQuestions.map(q => {
          const options = q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.correct }));
          const shuffledOptions = shuffleArray(options);
          return {
            ...q,
            options: shuffledOptions,
            correctAnswerText: q.options[q.correct]
          };
        });

        setQuestions(preparedQuestions);
        setCurrentQIndex(0);
        setUserAnswers([]);
        setScore(0);
        setShowFeedback(false);
        setSelectedOption(null);
        setView('quiz');
      };

      const handleAnswer = (optionIndex) => {
        if (showFeedback) return; // Prevent double click
        
        setSelectedOption(optionIndex);
        setShowFeedback(true);
        
        const q = questions[currentQIndex];
        const isCorrect = q.options[optionIndex].isCorrect;
        
        if (isCorrect) {
          playSound('correct');
          setScore(s => s + 1);
        } else {
          playSound('incorrect');
        }

        const newUserAnswers = [...userAnswers, {
          question: q.q,
          selectedText: q.options[optionIndex].text,
          isCorrect: isCorrect,
          correctText: q.correctAnswerText,
          explanation: q.explanation
        }];
        setUserAnswers(newUserAnswers);

        setTimeout(() => {
          if (currentQIndex + 1 < questions.length) {
            setCurrentQIndex(currentQIndex + 1);
            setShowFeedback(false);
            setSelectedOption(null);
          } else {
            playSound('win');
            setView('results');
          }
        }, 1500);
      };

      // Calculate Chilean Grade (1.0 to 7.0) based on 60% requirement
      const calculateGrade = () => {
        const max = questions.length;
        const req = max * 0.6;
        let finalGrade = 1.0;
        
        if (score < req) {
          finalGrade = 1 + (score * 3) / req;
        } else {
          finalGrade = 4 + ((score - req) * 3) / (max - req);
        }
        return finalGrade.toFixed(1);
      };

      // --- RENDERS ---
      
      const renderMenu = () => (

                  <button onClick={() => startQuiz('mayas')} className="w-full bg-green-600 hover:bg-green-700 text-white rounded-xl py-3 font-bold shadow-md btn-bounce">

            <div className="bg-white rounded-3xl p-6 md:p-10 shadow-xl border-b-8 border-purple-200 mb-6 text-center">

                {q.q}

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {q.options.map((opt, idx) => {
                  let btnClass = "bg-slate-100 hover:bg-slate-200 text-slate-700 border-2 border-slate-200";
                  let icon = "";

                  if (showFeedback) {
                    if (opt.isCorrect) {
                      btnClass = "bg-green-100 border-green-500 text-green-800";
                      icon = <i className="fa-solid fa-check-circle text-green-500 ml-2"></i>;

                    } else {
                      btnClass = "bg-slate-50 border-slate-100 text-slate-400 opacity-50";

                  return (
                    <button

      const renderResults = () => {
        const grade = calculateGrade();
        const isApproved = parseFloat(grade) >= 4.0;
        
        return (
          <div className="max-w-4xl mx-auto p-4 md:p-6 animate-[fadeIn_0.5s_ease-out]">
            
            <div className={`rounded-3xl p-8 text-center text-white shadow-2xl mb-8 relative overflow-hidden ${isApproved ? 'bg-gradient-to-r from-emerald-500 to-green-600' : 'bg-gradient-to-r from-orange-400 to-red-500'}`}>
              <i className={`fa-solid ${isApproved ? 'fa-trophy' : 'fa-book-open'} text-6xl mb-4`}></i>
              <h2 className="text-4xl font-extrabold mb-2">
                {isApproved ? '¡Excelente Trabajo!' : '¡A seguir repasando!'}
              </h2>
              <p className="text-xl opacity-90 mb-6">Completaste el Súper Quiz ({quizTopic ? quizTopic.toUpperCase() : ''})</p>
              
              <div className="flex justify-center items-center space-x-8 bg-white/20 rounded-2xl p-6 backdrop-blur-sm max-w-md mx-auto">
                <div>
                  <p className="text-sm uppercase tracking-wider opacity-80">Puntaje</p>
                  <p className="text-3xl font-bold">{score} / {questions.length}</p>
                </div>
                <div className="h-12 w-1 bg-white/30 rounded"></div>
                <div>
                  <p className="text-sm uppercase tracking-wider opacity-80">Nota</p>
                  <p className="text-5xl font-black">{grade}</p>
                </div>
              </div>
            </div>

            <h3 className="text-2xl font-bold text-slate-700 mb-6 flex items-center">
              <i className="fa-solid fa-magnifying-glass mr-2 text-purple-500"></i> Revisión de Respuestas
            </h3>
            
            <div className="space-y-4">
              {userAnswers.map((ans, idx) => (
                <div key={idx} className={`p-5 rounded-2xl border-l-8 bg-white shadow-sm ${ans.isCorrect ? 'border-green-500' : 'border-red-500'}`}>
                  <p className="font-bold text-slate-800 mb-3">{idx + 1}. {ans.question}</p>
                  
                  <div className="flex flex-col md:flex-row gap-4 mb-3 text-sm">
                    <div className="flex-1 bg-slate-50 p-3 rounded-lg border border-slate-100">
                      <span className="text-slate-500 block mb-1">Tu respuesta:</span>
                      <span className={`font-semibold ${ans.isCorrect ? 'text-green-600' : 'text-red-600'}`}>
                        {ans.isCorrect ? <i className="fa-solid fa-check mr-1"></i> : <i className="fa-solid fa-times mr-1"></i>}
                        {ans.selectedText}
                      </span>
                    </div>
                    
                    {!ans.isCorrect && (
                      <div className="flex-1 bg-green-50 p-3 rounded-lg border border-green-100">
                        <span className="text-green-700 block mb-1">Respuesta correcta:</span>
                        <span className="font-semibold text-green-800">{ans.correctText}</span>
                      </div>
                    )}
                  </div>
                  
                  <div className="bg-blue-50 text-blue-800 p-3 rounded-lg text-sm flex items-start">
                    <i className="fa-solid fa-circle-info mt-1 mr-2 opacity-70"></i>
                    <p>{ans.explanation}</p>
                  </div>
                </div>
              ))}
            </div>

            <div className="mt-10 text-center pb-10">
              <button onClick={() => { window.scrollTo(0,0); setView('menu'); }} className="bg-slate-800 hover:bg-slate-900 text-white rounded-full py-4 px-8 shadow-xl btn-bounce font-bold text-lg">
                <i className="fa-solid fa-home mr-2"></i> Volver al Inicio
              </button>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen py-8">
          <style>{`
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
          `}</style>
          {view === 'menu' && renderMenu()}
          {view === 'study' && renderStudy()}
          {view === 'quiz' && renderQuiz()}
          {view === 'results' && renderResults()}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
