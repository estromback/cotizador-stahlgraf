    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2); // G5
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
          osc.frequency.exponentialRampToValueAtTime(146.83, ctx.currentTime + 0.2); // D3
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const oscWin = ctx.createOscillator();
            const gainWin = ctx.createGain();
            oscWin.connect(gainWin);
            gainWin.connect(ctx.destination);
            oscWin.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
            gainWin.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.12);
            gainWin.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.2);
            oscWin.start(ctx.currentTime + idx * 0.12);
            oscWin.stop(ctx.currentTime + idx * 0.12 + 0.2);
          });
        }
      } catch (e) {
        // Fallback silently if audio fails
      }
    };

    const shuffleArray = (array) => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    // Calculate Chilean scale grade (1.0 to 7.0, 60% threshold)
    const calculateGrade = (score, total) => {
      if (total === 0) return "1.0";
      const percentage = score / total;
      let grade;
      if (percentage < 0.6) {
        grade = 1.0 + (percentage / 0.6) * 3.0;
      } else {
        grade = 4.0 + ((percentage - 0.6) / 0.4) * 3.0;
      }
      return grade.toFixed(1);
    };

                  {/* Multiple Choice Options */}
                  <div className="grid grid-cols-1 gap-3">
                    {quizQuestions[currentIdx].options.map((optText, optIdx) => {
                      let btnStyle = "bg-white border-slate-200 hover:border-purple-300 text-slate-700";

                      if (selectedOption !== null) {
                        if (optIdx === quizQuestions[currentIdx].answer) {
                          btnStyle = "bg-emerald-500 border-emerald-600 text-white font-bold shadow-md";
                        } else if (optIdx === selectedOption) {
                          btnStyle = "bg-red-500 border-red-600 text-white font-bold";
                        } else {
                          btnStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                        }
                      }

                      return (
                        <button
                          key={optIdx}
                          disabled={selectedOption !== null}
                          onClick={() => handleOptionClick(optIdx)}
                          className={`w-full p-4 rounded-2xl border-2 text-left text-sm md:text-base font-semibold transition-all flex items-center justify-between ${btnStyle}`}
                        >
                          <span>{optText}</span>
                          {selectedOption !== null && optIdx === quizQuestions[currentIdx].answer && (
                            <i className="fa-solid fa-circle-check text-xl"></i>
                          )}
                          {selectedOption !== null && optIdx === selectedOption && optIdx !== quizQuestions[currentIdx].answer && (
                            <i className="fa-solid fa-circle-xmark text-xl"></i>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Footer */}
          <footer className="mt-12 text-center text-xs text-slate-500 space-y-1">
            <p><strong>English Study App - Colegio La Fuente (4° Básico)</strong></p>
            <p>Unit 2: The City: Means of Transportation and Occupations</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
