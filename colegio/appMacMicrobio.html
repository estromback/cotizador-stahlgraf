  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Sound Helper ---
    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2); // G5
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
          osc.frequency.exponentialRampToValueAtTime(146.83, ctx.currentTime + 0.2); // D3
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const oscWin = ctx.createOscillator();
            const gainWin = ctx.createGain();
            oscWin.connect(gainWin);
            gainWin.connect(ctx.destination);
            oscWin.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
            gainWin.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.12);
            gainWin.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.2);
            oscWin.start(ctx.currentTime + idx * 0.12);
            oscWin.stop(ctx.currentTime + idx * 0.12 + 0.2);
          });
        }
      } catch (e) {
        // Audio fallback ignore
      }
    };

    // --- Quiz Questions ---
    const QUIZ_QUESTIONS = [
      // Selección Múltiple
      {

      {

      {

      },
      {

      {

      {

      },
      {
        question: "¿Cómo es físicamente un microbio según el cuento?",
        options: ["Son blancos y muy grandes.", "Son negros y de cola larga.", "Tienen forma de cuadrado rojo.", "Son invisibles y de color verde."],

      },
      {

        options: ["Porque ya la había curado.", "Porque se aburrió de estar allí.", "Porque sabía que Loc era más fuerte y lo mataría si no escapaba.", "Porque quería ir a atacar al doctor."],

      },
      {
        question: "¿Quién asume como jefe de los microbios tras la partida de Mac?",

        answer: 1,

      },
      {
        question: "¿Dónde se realiza la asamblea extraordinaria de los microbios?",
        options: ["En el laboratorio de la clínica.", "A orillas de un lago, a pasos de un sauce.", "En la habitación de María Angélica.", "Dentro de una pluma de pájaro."],
        answer: 1,
        explanation: "La historia comienza con la gran asamblea cerca del sauce llorón, a orillas del lago."
      },

      // Verdadero y Falso
      {

      },
      {

      },
      {

        answer: 1,
        explanation: "Falso. Fue Mac quien inició el viaje con los diez ayudantes, no Loc."
      },
      {

        options: ["Verdadero", "Falso"],
        answer: 1,
        explanation: "Falso. María Angélica era una niña, hija de un hombre que vivía cerca de la ciudad."
      },
      {
        question: "Verdadero o Falso: Mac es el único microbio que logra salir con vida del cuerpo de la niña y vuelve triste y derrotado.",
        options: ["Verdadero", "Falso"],
        answer: 0,
        explanation: "Mac fue el único sobreviviente de la brigada de asalto, pues Loc destruyó a los demás que quedaban en el cuerpo."
      },
      {
        question: "Verdadero o Falso: Al marcharse Mac, asume como Jefe el Microbio Gris.",
        options: ["Verdadero", "Falso"],
        answer: 0,
        explanation: "El Microbio Gris quedó a cargo de la tribu mientras Mac realizaba el asalto."
      },
      {
        question: "Verdadero o Falso: Mac vivía en una playa cerca del pueblo.",
        options: ["Verdadero", "Falso"],
        answer: 1,
        explanation: "Falso. La colonia de microbios vivía a orillas de un apacible lago."
      },
      {
        question: "Verdadero o Falso: Antes de salir Mac en busca del hombre es apoyado por su pueblo.",
        options: ["Verdadero", "Falso"],
        answer: 0,
        explanation: "Los microbios jóvenes lo apoyaron fervientemente y aceptaron su liderazgo y plan."
      },
      {
        question: "Verdadero o Falso: El Microbio Gris propone crear una brigada de asalto.",
        options: ["Verdadero", "Falso"],
        answer: 0,
        explanation: "Para proteger al resto de la comunidad, el Microbio Gris usó la astucia para sugerir que solo fuera un grupo pequeño primero."
      },
      {
        question: "Verdadero o Falso: El Patriarca era el microbio más joven, talentoso y soñador de todos.",
        options: ["Verdadero", "Falso"],
        answer: 1,
        explanation: "Falso. El Patriarca era el más anciano y sabio de todos los microbios."
      },
      {
        question: "Verdadero o Falso: La muñeca de María Angélica se llamaba Lulú.",
        options: ["Verdadero", "Falso"],
        answer: 0,
        explanation: "Lulú era la muñeca de la niña y aparecía en sus visiones delirantes."
      },
      {
        question: "Verdadero o Falso: Loc era un microbio físicamente igual a Mac, pero más débil.",
        options: ["Verdadero", "Falso"],
        answer: 1,
        explanation: "Falso. Loc era físicamente parecido pero mucho más fuerte y con una cola afilada como espada."
      },
      {
        question: "Verdadero o Falso: Los microbios de la historia eran microbios de agua.",
        options: ["Verdadero", "Falso"],
        answer: 1,
        explanation: "Falso. Eran microbios de tierra; por esa razón, cuando cayeron al lago junto con el sauce, se ahogaron."
      },
      {
        question: "Verdadero o Falso: Las visiones del conejo incluyeron una montaña con cara de asno.",
        options: ["Verdadero", "Falso"],
        answer: 0,
        explanation: "Entre las alucinaciones que sufrió el conejo por la fiebre reidora estaba la montaña con cara de asno y hierba que bailaba."
      },
      {
        question: "Verdadero o Falso: Mac quería atacar al hombre para que su pueblo viviera en paz por siempre.",
        options: ["Verdadero", "Falso"],
        answer: 1,
        explanation: "Falso. Mac quería atacar al hombre por ambición, para ser famosos, temidos y dejar de ser 'desconocidos'."
      }
    ];

    const shuffleArray = (array) => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    const calculateGrade = (score, total) => {
      if (total === 0) return "1.0";
      const percentage = score / total;
      let grade;
      if (percentage < 0.6) {
        grade = 1.0 + (percentage / 0.6) * 3.0;
      } else {
        grade = 4.0 + ((percentage - 0.6) / 0.4) * 3.0;
      }
      return grade.toFixed(1);
    };

    function App() {
      const [activeTab, setActiveTab] = useState('summary'); 
      const [quizStarted, setQuizStarted] = useState(false);
      const [currentQuestions, setCurrentQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswers, setUserAnswers] = useState([]);
      const [selectedOption, setSelectedOption] = useState(null);
      const [quizCompleted, setQuizCompleted] = useState(false);
      const [score, setScore] = useState(0);

      const startNewQuiz = (qCount = 35) => {
        let pool = shuffleArray(QUIZ_QUESTIONS);
        let selected = pool.slice(0, Math.min(qCount, pool.length));
        
        const formatted = selected.map((q) => {
          const isTrueFalse = q.options.length === 2 && q.options.includes("Verdadero");
          
          if (isTrueFalse) {
            // Keep V/F in order
            return { ...q };
          } else {
            // Shuffle multiple choice
            const originalOptions = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.answer }));
            const shuffledOpts = shuffleArray(originalOptions);
            const newCorrectIdx = shuffledOpts.findIndex(o => o.isCorrect);
            return {
              question: q.question,
              options: shuffledOpts.map(o => o.text),
              answer: newCorrectIdx,
              explanation: q.explanation
            };
          }
        });

        setCurrentQuestions(formatted);
        setCurrentIndex(0);
        setUserAnswers([]);
        setSelectedOption(null);
        setQuizCompleted(false);
        setScore(0);
        setQuizStarted(true);
      };

      const handleOptionSelect = (optionIdx) => {
        if (selectedOption !== null) return; 

        setSelectedOption(optionIdx);
        const isCorrect = optionIdx === currentQuestions[currentIndex].answer;
        if (isCorrect) {
          playSound('correct');
          setScore(prev => prev + 1);
        } else {
          playSound('wrong');
        }

        const newAnswers = [...userAnswers, {
          questionIdx: currentIndex,
          selected: optionIdx,
          correct: currentQuestions[currentIndex].answer,
          isCorrect
        }];
        setUserAnswers(newAnswers);

        setTimeout(() => {
          if (currentIndex + 1 < currentQuestions.length) {
            setCurrentIndex(prev => prev + 1);
            setSelectedOption(null);
          } else {
            setQuizCompleted(true);
            playSound('win');
          }
        }, 1300);
      };

      return (
        <div className="max-w-5xl mx-auto px-4 py-8">
          {/* Header */}
          <header className="bg-gradient-to-r from-sky-500 to-indigo-600 rounded-3xl p-8 text-white shadow-xl mb-8 flex flex-col md:flex-row items-center justify-between gap-6">
            <div className="flex items-center gap-6">
              <div className="w-20 h-20 bg-white text-4xl flex items-center justify-center rounded-full shadow-lg text-sky-500">
                🦠
              </div>
              <div>
                <h1 className="text-3xl md:text-4xl font-bold font-fun">Mac el microbio desconocido</h1>
                <p className="text-sky-100 mt-2 font-medium">Guía de Estudio Interactiva • 4° Básico</p>
              </div>
            </div>
          </header>

          {/* Nav */}
          <nav className="flex flex-wrap gap-3 mb-8">
            <button

                activeTab === 'summary' ? 'bg-sky-500 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-sky-50'
              }`}
            >
              📖 Resumen y Personajes
            </button>
            <button
              onClick={() => setActiveTab('details')}
              className={`flex-1 min-w-[150px] py-3 px-4 rounded-xl font-fun font-bold text-lg transition-all ${
                activeTab === 'details' ? 'bg-indigo-500 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-indigo-50'
              }`}
            >
              🔍 Ambientes y Fiebre
            </button>
            <button
              onClick={() => setActiveTab('quiz')}
              className={`flex-1 min-w-[150px] py-3 px-4 rounded-xl font-fun font-bold text-lg transition-all ${
                activeTab === 'quiz' ? 'bg-amber-500 text-white shadow-md' : 'bg-white text-slate-600 hover:bg-amber-50'
              }`}
            >
              ⚡ Súper Quiz
            </button>
          </nav>

          {/* TAB 1: SUMMARY */}
          {activeTab === 'summary' && (
            <div className="space-y-6">
              <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h2 className="text-2xl font-fun text-sky-700 mb-4 border-b-2 border-sky-100 pb-2">De qué trata la historia</h2>
                <p className="text-slate-700 leading-relaxed">
                  Esta es la historia de una colonia de microbios que vive a orillas de un lago tranquilo junto a un sauce llorón.
                  El líder anciano, el <strong>Patriarca</strong>, antes de morir aconseja a su pueblo mantenerse escondidos del humano para sobrevivir.
                  Sin embargo, un microbio joven, impulsivo y fuerte llamado <strong>Mac</strong>, decide desobedecer y liderar un ataque para volverse famoso y derrotar al hombre.
                  Con su <strong>"Brigada de Asalto"</strong> (él y 10 ayudantes) entran al cuerpo de una niña, provocándole la terrible <strong>Fiebre Reidora</strong>.
                </p>
              </div>

              <h2 className="text-2xl font-fun text-indigo-700 mt-8 mb-4">Personajes Principales</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-sky-500 card-bounce">
                  <h3 className="font-fun text-xl text-sky-800 font-bold mb-2">🦠 Mac</h3>
                  <p className="text-sm text-slate-600">
                    Es un microbio joven, líder de la fuerza. Es ambicioso, busca la fama y rechaza ser un "microbio desconocido". Lidera el ataque contra el humano.
                  </p>
                </div>
                
                <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-slate-400 card-bounce">
                  <h3 className="font-fun text-xl text-slate-700 font-bold mb-2">👴 El Patriarca</h3>
                  <p className="text-sm text-slate-600">
                    El jefe anciano de los microbios. Representa la sabiduría, la prudencia y la madurez. Quería mantener la paz y que nadie los descubriera.

                </div>

                <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-emerald-500 card-bounce">
                  <h3 className="font-fun text-xl text-emerald-800 font-bold mb-2">🛡️ Loc</h3>
                  <p className="text-sm text-slate-600">
                    Microbio bueno creado en el laboratorio por los médicos a partir de los ayudantes de Mac. Es casi igual a él, pero tiene una <strong>cola filuda</strong> y quiere salvar al hombre.
                  </p>
                </div>

                <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-amber-500 card-bounce">
                  <h3 className="font-fun text-xl text-amber-800 font-bold mb-2">🧠 El Microbio Gris</h3>
                  <p className="text-sm text-slate-600">
                    Un microbio anciano y astuto. Para evitar que todo el pueblo muera, propone usar la inteligencia y enviar solo una "brigada de asalto" al principio. Queda al mando cuando Mac se va.
                  </p>
                </div>

                <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-pink-400 card-bounce">
                  <h3 className="font-fun text-xl text-pink-700 font-bold mb-2">👧 María Angélica</h3>
                  <p className="text-sm text-slate-600">
                    Dulce niña que se enferma al acercar a su nariz las plumas del pájaro donde venían escondidos los microbios. Sufre delirios por la enfermedad.
                  </p>
                </div>

                <div className="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-purple-400 card-bounce">
                  <h3 className="font-fun text-xl text-purple-700 font-bold mb-2">🐇 El Conejo Blanco</h3>
                  <p className="text-sm text-slate-600">
                    Animalito de la clínica que los doctores inyectaron con microbios para estudiar cómo avanzaba la enfermedad y sus síntomas.
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: DETAILS */}
          {activeTab === 'details' && (
            <div className="space-y-8">
              {/* Ambientes */}
              <section>
                <h2 className="text-2xl font-fun text-sky-700 mb-4 border-b-2 border-sky-100 pb-2">Ambientes: ¿Dónde ocurre la historia?</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h3 className="font-bold text-sky-800 mb-2">1. El Lago</h3>
                    <p className="text-sm text-slate-600">
                      Lugar hermoso y apacible. Sus aguas son quietas y transparentes. En su orilla, cerca de un sauce llorón, habitaba la inmensa colonia de negros microbios.
                    </p>
                  </div>
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h3 className="font-bold text-pink-800 mb-2">2. Casa de María Angélica</h3>
                    <p className="text-sm text-slate-600">
                      Ubicada cerca de la ciudad. El relato ocurre en su dormitorio donde juega junto a la ventana. A los pies de la cuna de su muñeca Lulú había un sombrerito con plumas de colores (traídas por su padre).
                    </p>
                  </div>
                  <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h3 className="font-bold text-emerald-800 mb-2">3. La Clínica</h3>
                    <p className="text-sm text-slate-600">
                      Una habitación blanca con gran ventana. En ella está el <strong>laboratorio</strong>, lleno de microscopios, placas y frascos con líquidos. Allí los doctores crean el antídoto (Loc) y está el conejo.
                    </p>
                  </div>
                </div>
              </section>

              {/* Fiebre Reidora */}
              <section className="bg-amber-50 p-6 rounded-3xl border border-amber-200">
                <h2 className="text-2xl font-fun text-amber-800 mb-4">La "Fiebre Reidora"</h2>
                
                <div className="mb-6">
                  <h3 className="font-bold text-slate-800 mb-2">¿Cómo atacaban los microbios?</h3>
                  <p className="text-sm text-slate-700">
                    La <em>Brigada de Asalto</em> (Mac y 10 ayudantes) viajaron en las plumas de un ave. Cuando la niña olió las plumas, entraron por su nariz, descendieron por su garganta, viajaron por su sangre y llegaron a atacar su corazón.
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <h3 className="font-bold text-slate-800 mb-2">Síntomas Físicos:</h3>
                    <ul className="list-disc pl-5 text-sm text-slate-700 space-y-1">
                      <li>El corazón latía con mucha fuerza.</li>
                      <li>Violentos escalofríos y manos que tiritaban.</li>
                      <li>Cansancio y mucha debilidad.</li>
                      <li>Fiebre altísima que causa delirios.</li>
                      <li>Ataques de risa espeluznante e incontrolable.</li>
                    </ul>
                  </div>

                  <div>
                    <h3 className="font-bold text-slate-800 mb-2">Visiones y Alucinaciones:</h3>
                    <ul className="list-disc pl-5 text-sm text-slate-700 space-y-1">
                      <li>Una rana que canta en el sombrero de Lulú (su muñeca).</li>
                      <li>Un elefante que cambia su cola por la trompa de un mono.</li>
                      <li>Lulú montada en una jirafa.</li>
                      <li>Un enanito columpiándose en la luna.</li>
                      <li><strong>Visiones del conejo:</strong> Una montaña con cara de asno y hierba que bailaba sola.</li>
                    </ul>
                  </div>
                </div>
              </section>
            </div>
          )}

          {/* TAB 3: QUIZ */}
          {activeTab === 'quiz' && (
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-amber-200">
              {!quizStarted ? (
                <div className="text-center py-10 max-w-lg mx-auto">
                  <div className="text-6xl mb-4">🎯</div>
                  <h2 className="text-3xl font-fun text-slate-800 mb-4">Súper Quiz de Mac</h2>
                  <p className="text-slate-600 mb-8">
                    Demuestra todo lo que sabes del libro respondiendo preguntas de Selección Múltiple y Verdadero/Falso tal como en tu prueba del colegio.
                  </p>
                  <button
                    onClick={() => startNewQuiz(30)}
                    className="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white font-fun text-xl rounded-2xl shadow-lg shadow-amber-200 transition-all transform hover:scale-105"
                  >
                    ¡Comenzar Quiz! (30 Preguntas)
                  </button>
                </div>
              ) : quizCompleted ? (
                <div className="py-6">
                  <div className="bg-gradient-to-br from-amber-500 to-orange-500 text-white p-8 rounded-3xl text-center shadow-xl mb-8">
                    <div className="text-6xl mb-4">🏆</div>
                    <h2 className="text-4xl font-fun mb-2">¡Prueba Finalizada!</h2>
                    
                    <div className="flex justify-center gap-6 my-6">
                      <div className="bg-white/20 px-6 py-3 rounded-2xl">
                        <span className="block text-sm uppercase font-bold text-amber-100">Aciertos</span>
                        <span className="text-3xl font-bold">{score} / {currentQuestions.length}</span>
                      </div>
                      <div className="bg-white/20 px-6 py-3 rounded-2xl">
                        <span className="block text-sm uppercase font-bold text-amber-100">Nota Estimada</span>
                        <span className="text-3xl font-bold text-yellow-300">{calculateGrade(score, currentQuestions.length)}</span>
                      </div>
                    </div>
                    
                    <button
                      onClick={() => startNewQuiz(30)}
                      className="px-6 py-3 bg-white text-amber-600 font-bold rounded-xl hover:bg-amber-50 transition-all"
                    >
                      Volver a Jugar
                    </button>
                  </div>

                  <h3 className="font-fun text-2xl text-slate-800 mb-4">Revisión de tus respuestas:</h3>
                  <div className="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                    {userAnswers.map((ans, idx) => {
                      const q = currentQuestions[ans.questionIdx];
                      return (
                        <div key={idx} className={`p-4 rounded-2xl border ${ans.isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'}`}>
                          <div className="flex items-start justify-between mb-2">
                            <span className="font-bold text-xs bg-white px-2 py-1 rounded text-slate-600 shadow-sm">Pregunta {idx + 1}</span>
                            <span className={`text-xs font-bold px-2 py-1 rounded ${ans.isCorrect ? 'bg-emerald-200 text-emerald-800' : 'bg-red-200 text-red-800'}`}>
                              {ans.isCorrect ? 'Correcta ✓' : 'Incorrecta ✗'}
                            </span>
                          </div>
                          <p className="font-bold text-slate-800 mb-2">{q.question}</p>
                          <div className="text-sm space-y-1 mb-2">
                            <p className="text-slate-600">Tú respondiste: <strong className={ans.isCorrect ? 'text-emerald-700' : 'text-red-700'}>{q.options[ans.selected]}</strong></p>
                            {!ans.isCorrect && (
                              <p className="text-emerald-700 font-bold">La correcta era: {q.options[q.answer]}</p>
                            )}
                          </div>
                          <div className="bg-white/60 p-2 rounded text-xs text-slate-600 italic">
                            💡 {q.explanation}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ) : (
                <div className="space-y-6 max-w-2xl mx-auto">
                  <div className="flex items-center justify-between text-sm font-bold text-slate-500">
                    <span>Pregunta {currentIndex + 1} de {currentQuestions.length}</span>
                    <span className="text-amber-500">Puntos: {score}</span>
                  </div>

                  <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                    <div className="h-full bg-amber-500 transition-all duration-300" style={{ width: `${((currentIndex + 1) / currentQuestions.length) * 100}%` }}></div>
                  </div>

                  <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                    <h3 className="font-fun text-xl text-slate-800 leading-snug">
                      {currentQuestions[currentIndex].question}
                    </h3>
                  </div>

                  <div className="grid grid-cols-1 gap-3">
                    {currentQuestions[currentIndex].options.map((optText, optIdx) => {
                      let btnClass = "bg-white border-2 border-slate-200 text-slate-700 hover:border-amber-300";
                      
                      if (selectedOption !== null) {
                        if (optIdx === currentQuestions[currentIndex].answer) {
                          btnClass = "bg-emerald-500 border-emerald-600 text-white font-bold";
                        } else if (optIdx === selectedOption) {
                          btnClass = "bg-red-500 border-red-600 text-white font-bold";
                        } else {
                          btnClass = "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                        }
                      }

                      return (
                        <button
                          key={optIdx}
                          disabled={selectedOption !== null}
                          onClick={() => handleOptionSelect(optIdx)}
                          className={`w-full p-4 rounded-xl text-left text-sm md:text-base font-semibold transition-all flex items-center justify-between ${btnClass}`}
                        >
                          <span>{optText}</span>
                          {selectedOption !== null && optIdx === currentQuestions[currentIndex].answer && <i className="fa-solid fa-check-circle text-xl"></i>}
                          {selectedOption !== null && optIdx === selectedOption && optIdx !== currentQuestions[currentIndex].answer && <i className="fa-solid fa-times-circle text-xl"></i>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
