<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Aventura de Estudio para Segundo Básico!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f9ff;
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
        }
        .btn-bouncy {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-bouncy:active {
            transform: scale(0.95);
        }
        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.3s ease-out forwards;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #fbbf24;
            animation: fall 2s linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 relative overflow-x-hidden">

    <header class="w-full max-w-2xl flex justify-between items-center bg-white p-4 rounded-2xl shadow-lg border-4 border-blue-400 mb-6 mt-2">
        <h1 class="text-2xl sm:text-3xl font-black text-blue-600 flex items-center gap-2">
            🚀 ¡Hola Segundo Básico!
        </h1>
        <div class="flex items-center gap-2 bg-yellow-100 px-4 py-2 rounded-xl border-2 border-yellow-400">
            <span class="text-2xl">⭐</span>
            <span id="score-display" class="text-2xl font-black text-yellow-600">0</span>
        </div>
    </header>

    <!-- MAIN MENU -->
    <main id="screen-menu" class="w-full max-w-2xl flex-1 flex flex-col items-center justify-center gap-6 pop-in">
        <h2 class="text-2xl font-bold text-slate-700 text-center mb-4">¿Qué quieres repasar hoy?</h2>
        
        <button onclick="startMathMode()" class="btn-bouncy w-full max-w-sm bg-gradient-to-b from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 text-white text-xl sm:text-2xl font-black py-6 px-8 rounded-3xl shadow-[0_8px_0_#166534] border-4 border-green-800 flex items-center justify-center gap-4">
            <span>➕</span> Problemas Matemáticos <span>➖</span>
        </button>

        <button onclick="startMeasurementMode()" class="btn-bouncy w-full max-w-sm bg-gradient-to-b from-purple-400 to-purple-600 hover:from-purple-500 hover:to-purple-700 text-white text-xl sm:text-2xl font-black py-6 px-8 rounded-3xl shadow-[0_8px_0_#4c1d95] border-4 border-purple-800 flex items-center justify-center gap-4">
            <span>📏</span> Medidas y Reglas <span>📐</span>
        </button>

        <button onclick="startTestMode()" class="btn-bouncy w-full max-w-sm bg-gradient-to-b from-red-400 to-red-600 hover:from-red-500 hover:to-red-700 text-white text-xl sm:text-2xl font-black py-6 px-8 rounded-3xl shadow-[0_8px_0_#991b1b] border-4 border-red-800 flex items-center justify-center gap-4 mt-4">
            <span>📝</span> Prueba con Nota <span>💯</span>
        </button>
    </main>

    <!-- MATH SCREEN -->
    <section id="screen-math" class="w-full max-w-2xl hidden flex-col items-center gap-6 pop-in">
        <div class="w-full flex justify-between">
            <button onclick="showMenu()" class="btn-bouncy bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-xl border-2 border-slate-400">⬅️ Volver</button>
            <div class="text-green-600 font-black text-xl">Matemáticas</div>
        </div>

        <div class="bg-white w-full p-6 sm:p-8 rounded-3xl shadow-xl border-4 border-green-400">
            <p id="math-problem-text" class="text-xl sm:text-2xl font-bold text-slate-700 mb-6 leading-relaxed text-center"></p>
            
            <div class="bg-green-50 p-4 rounded-2xl border-2 border-green-200 mb-6">
                <p class="text-sm font-bold text-green-700 mb-3 text-center uppercase tracking-wider">Arma tu expresión matemática:</p>
                <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-4 text-2xl font-black">
                    <input type="number" id="math-input-1" class="w-16 sm:w-20 text-center p-2 rounded-xl border-4 border-slate-300 focus:border-green-500 outline-none hide-arrows shadow-inner" placeholder="?">
                    
                    <select id="math-operator" class="p-2 rounded-xl border-4 border-slate-300 focus:border-green-500 outline-none bg-white text-center cursor-pointer shadow-inner">
                        <option value="?">?</option>
                        <option value="+">+</option>
                        <option value="-">-</option>
                    </select>

                    <input type="number" id="math-input-2" class="w-16 sm:w-20 text-center p-2 rounded-xl border-4 border-slate-300 focus:border-green-500 outline-none hide-arrows shadow-inner" placeholder="?">
                    
                    <span class="text-slate-500">=</span>
                    
                    <input type="number" id="math-result" class="w-20 sm:w-24 text-center p-2 rounded-xl border-4 border-green-400 focus:border-green-600 outline-none hide-arrows bg-green-100 shadow-inner" placeholder="Total">
                </div>
            </div>

            <button onclick="checkMath()" class="btn-bouncy w-full bg-blue-500 hover:bg-blue-600 text-white text-xl font-black py-4 rounded-2xl shadow-[0_6px_0_#1e3a8a] border-2 border-blue-800">
                ¡Revisar Respuesta! ✨
            </button>
        </div>
    </section>

    <!-- MEASUREMENT SCREEN -->
    <section id="screen-measure" class="w-full max-w-2xl hidden flex-col items-center gap-6 pop-in">
        <div class="w-full flex justify-between">
            <button onclick="showMenu()" class="btn-bouncy bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-xl border-2 border-slate-400">⬅️ Volver</button>
            <div class="text-purple-600 font-black text-xl">Medición</div>
        </div>

        <div class="bg-white w-full p-6 sm:p-8 rounded-3xl shadow-xl border-4 border-purple-400">
            <div id="measure-image-container" class="w-full flex justify-center mb-6 hidden">
                <div class="text-6xl animate-bounce-slow" id="measure-emoji"></div>
            </div>
            
            <p id="measure-question-text" class="text-xl sm:text-2xl font-bold text-slate-700 mb-8 leading-relaxed text-center"></p>
            
            <div id="measure-options" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Opciones generadas por JS -->
            </div>
        </div>
    </section>

    <!-- TEST SCREEN -->
    <section id="screen-test" class="w-full max-w-2xl hidden flex-col items-center gap-6 pop-in">
        <div class="w-full flex justify-between items-center bg-white p-4 rounded-2xl border-4 border-red-400 shadow-md">
            <button onclick="showMenu()" class="btn-bouncy bg-slate-200 text-slate-700 font-bold py-2 px-4 rounded-xl border-2 border-slate-400">⬅️ Salir</button>
            <div class="text-red-600 font-black text-xl">Pregunta <span id="test-q-current">1</span>/10</div>
        </div>

        <div class="w-full bg-slate-200 h-4 rounded-full overflow-hidden">
            <div id="test-progress-bar" class="bg-red-500 h-full w-0 transition-all duration-300"></div>
        </div>

        <div class="bg-white w-full p-6 sm:p-8 rounded-3xl shadow-xl border-4 border-red-400" id="test-content-container">
            <!-- Contenido inyectado por JS -->
        </div>
    </section>

    <!-- TEST RESULT SCREEN -->
    <section id="screen-test-result" class="w-full max-w-2xl hidden flex-col items-center justify-center gap-6 pop-in text-center mt-10">
        <div class="text-8xl mb-4" id="test-result-emoji">🎓</div>
        <h2 class="text-4xl font-black text-slate-800">¡Prueba Terminada!</h2>
        <p class="text-2xl font-bold text-slate-600">Tu puntaje es: <span id="test-final-score" class="text-blue-600">0</span> / 10</p>
        
        <div class="bg-white px-10 py-8 rounded-3xl border-8 border-slate-200 shadow-xl flex flex-col items-center gap-4">
            <span class="text-xl font-bold text-slate-500 uppercase tracking-widest">Nota Final</span>
            <span id="test-final-grade" class="text-7xl font-black text-red-500">1.0</span>
        </div>
        
        <button onclick="showMenu()" class="btn-bouncy mt-8 bg-gradient-to-b from-blue-400 to-blue-600 hover:from-blue-500 hover:to-blue-700 text-white text-2xl font-black py-4 px-10 rounded-2xl shadow-[0_6px_0_#1e3a8a] border-4 border-blue-800">
            Volver al Menú
        </button>
    </section>

    <!-- CUSTOM MESSAGE MODAL -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div id="modal-content" class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center border-8 transform scale-90 transition-transform duration-300">
            <div id="modal-icon" class="text-6xl mb-4"></div>
            <h3 id="modal-title" class="text-3xl font-black mb-2"></h3>
            <p id="modal-message" class="text-lg font-bold text-slate-600 mb-6"></p>
            <button onclick="closeModal()" class="btn-bouncy w-full bg-slate-800 text-white text-xl font-bold py-3 rounded-xl border-b-4 border-slate-950">
                Continuar
            </button>
        </div>
    </div>

    <style>
        /* Ocultar flechas en inputs de tipo numero */
        .hide-arrows::-webkit-outer-spin-button,
        .hide-arrows::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .hide-arrows {
            -moz-appearance: textfield;
        }
    </style>

    <!-- LOGIC -->
    <script>
        // Estado
        let score = 0;
        let currentMathState = null;
        let currentMeasureState = null;

        // Estado Prueba
        let testQuestionsPool = [];
        let currentTestIndex = 0;
        let testCorrectAnswers = 0;

        // Base de datos de objetos y preguntas de medición
        const measureQuestions = [
            { q: "¿En qué unidad de medida medirías una hormiga chiquitita?", emoji: "🐜", options: ["Centímetros (cm)", "Milímetros (mm)", "Metros (m)"], answer: "Milímetros (mm)" },
            { q: "¿Qué unidad usarías para medir el largo de tu estuche?", emoji: "✏️", options: ["Metros (m)", "Milímetros (mm)", "Centímetros (cm)"], answer: "Centímetros (cm)" },
            { q: "¿En qué unidad medirías el largo de una cancha de fútbol?", emoji: "⚽", options: ["Metros (m)", "Centímetros (cm)", "Milímetros (mm)"], answer: "Metros (m)" },
            { q: "¿Cuántos milímetros (mm) hay en 1 centímetro (cm)?", emoji: "📏", options: ["100 mm", "10 mm", "1 mm"], answer: "10 mm" },
            { q: "¿Cuántos centímetros (cm) hay en 1 metro (m)?", emoji: "📏", options: ["10 cm", "100 cm", "1000 cm"], answer: "100 cm" },
            { q: "Cuando usas tu regla para medir, ¿desde qué número debes empezar?", emoji: "📐", options: ["Desde el 1", "Desde el borde del plástico", "Desde el 0"], answer: "Desde el 0" },
            { q: "Si juntas 100 centímetros (cm), ¿qué otra unidad estás formando?", emoji: "🤔", options: ["1 milímetro (mm)", "1 metro (m)", "1 kilómetro"], answer: "1 metro (m)" },
            { q: "¿Qué es más largo?", emoji: "📏", options: ["1 metro (m)", "1 centímetro (cm)", "1 milímetro (mm)"], answer: "1 metro (m)" }
        ];

        // Temas de problemas para matemáticas
        const mathThemes = [
            { item: "cartas Pokémon", verbAdd: "le regala", verbSub: "pierde" },
            { item: "lápices de colores", verbAdd: "compra", verbSub: "le presta a un amigo" },
            { item: "stickers", verbAdd: "encuentra", verbSub: "pega en su cuaderno" },
            { item: "dulces", verbAdd: "le dan en un cumpleaños", verbSub: "se come" },
            { item: "fichas de lego", verbAdd: "encuentra en una caja", verbSub: "usa para armar una nave" }
        ];

        function updateScore(points) {
            score += points;
            const display = document.getElementById('score-display');
            display.innerText = score;
            display.classList.add('pop-in');
            setTimeout(() => display.classList.remove('pop-in'), 300);
        }

        function hideAllScreens() {
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-math').classList.add('hidden');
            document.getElementById('screen-measure').classList.add('hidden');
            document.getElementById('screen-test').classList.add('hidden');
            document.getElementById('screen-test-result').classList.add('hidden');
        }

        function showMenu() {
            hideAllScreens();
            document.getElementById('screen-menu').classList.remove('hidden');
        }

        function startMathMode() {
            hideAllScreens();
            document.getElementById('screen-math').classList.remove('hidden');
            generateMathProblem();
        }

        function startMeasurementMode() {
            hideAllScreens();
            document.getElementById('screen-measure').classList.remove('hidden');
            generateMeasureQuestion();
        }

        // === LÓGICA DE PRUEBA (TEST MODE) ===
        function startTestMode() {
            hideAllScreens();
            document.getElementById('screen-test').classList.remove('hidden');
            
            // Generar 10 preguntas (5 de matemáticas, 5 de medición)
            testQuestionsPool = [];
            testCorrectAnswers = 0;
            currentTestIndex = 0;

            // Seleccionar 5 preguntas de Medición al azar
            let mixedMeasures = [...measureQuestions].sort(() => Math.random() - 0.5).slice(0, 5);
            mixedMeasures.forEach(q => {
                testQuestionsPool.push({ type: 'measure', data: q });
            });

            // Generar 5 problemas de Matemáticas
            for(let i=0; i<5; i++) {
                testQuestionsPool.push({ type: 'math', data: generateMathData() });
            }

            // Mezclar las 10 preguntas resultantes
            testQuestionsPool.sort(() => Math.random() - 0.5);

            loadTestQuestion();
        }

        function generateMathData() {
            const isAddition = Math.random() > 0.5;
            let num1, num2, result;
            const theme = mathThemes[Math.floor(Math.random() * mathThemes.length)];
            let text = "";

            if (isAddition) {
                do {
                    num1 = Math.floor(Math.random() * 50) + 15;
                    num2 = Math.floor(Math.random() * 40) + 15;
                } while ((num1 % 10) + (num2 % 10) <= 9 || (num1 + num2) > 100);
                result = num1 + num2;
                text = `Tienes ${num1} ${theme.item}. Un amigo ${theme.verbAdd} ${num2} más. ¿Cuántos ${theme.item} tienes en total?`;
                return { text: text, n1: num1, n2: num2, op: '+', ans: result };
            } else {
                do {
                    num1 = Math.floor(Math.random() * 50) + 30;
                    num2 = Math.floor(Math.random() * 25) + 15;
                } while ((num1 % 10) >= (num2 % 10) || num1 <= num2);
                result = num1 - num2;
                text = `Tenías ${num1} ${theme.item}. Luego, ${theme.verbSub} ${num2}. ¿Cuántos ${theme.item} te quedan ahora?`;
                return { text: text, n1: num1, n2: num2, op: '-', ans: result };
            }
        }

        function loadTestQuestion() {
            if (currentTestIndex >= testQuestionsPool.length) {
                finishTest();
                return;
            }

            const q = testQuestionsPool[currentTestIndex];
            document.getElementById('test-q-current').innerText = currentTestIndex + 1;
            const progress = (currentTestIndex / testQuestionsPool.length) * 100;
            document.getElementById('test-progress-bar').style.width = progress + '%';

            const container = document.getElementById('test-content-container');
            container.innerHTML = '';

            if (q.type === 'measure') {
                const qObj = q.data;
                let html = `<p class="text-xl sm:text-2xl font-bold text-slate-700 mb-8 text-center">${qObj.q}</p>`;
                if (qObj.emoji) {
                    html = `<div class="text-6xl text-center mb-6 animate-bounce-slow">${qObj.emoji}</div>` + html;
                }
                
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'grid grid-cols-1 sm:grid-cols-2 gap-4';
                
                const shuffledOptions = [...qObj.options].sort(() => Math.random() - 0.5);
                shuffledOptions.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-bouncy w-full bg-slate-100 hover:bg-red-50 text-slate-700 font-bold py-4 px-6 rounded-2xl border-4 border-slate-300 hover:border-red-400 text-lg sm:text-xl transition-colors';
                    btn.innerText = opt;
                    btn.onclick = () => checkTestAnswer(q.type, opt, qObj.answer);
                    optionsDiv.appendChild(btn);
                });
                
                container.innerHTML = html;
                container.appendChild(optionsDiv);

            } else if (q.type === 'math') {
                const mData = q.data;
                currentMathState = mData; // Guardar para corrección
                
                container.innerHTML = `
                    <p class="text-xl sm:text-2xl font-bold text-slate-700 mb-6 text-center">${mData.text}</p>
                    <div class="bg-red-50 p-4 rounded-2xl border-2 border-red-200 mb-6">
                        <p class="text-sm font-bold text-red-700 mb-3 text-center uppercase tracking-wider">Arma tu expresión matemática:</p>
                        <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-4 text-2xl font-black">
                            <input type="number" id="test-math-1" class="w-16 sm:w-20 text-center p-2 rounded-xl border-4 border-slate-300 outline-none hide-arrows shadow-inner" placeholder="?">
                            <select id="test-math-op" class="p-2 rounded-xl border-4 border-slate-300 outline-none bg-white text-center cursor-pointer shadow-inner">
                                <option value="?">?</option><option value="+">+</option><option value="-">-</option>
                            </select>
                            <input type="number" id="test-math-2" class="w-16 sm:w-20 text-center p-2 rounded-xl border-4 border-slate-300 outline-none hide-arrows shadow-inner" placeholder="?">
                            <span class="text-slate-500">=</span>
                            <input type="number" id="test-math-res" class="w-20 sm:w-24 text-center p-2 rounded-xl border-4 border-red-400 outline-none bg-red-100 shadow-inner" placeholder="Total">
                        </div>
                    </div>
                    <button onclick="checkTestAnswer('math')" class="btn-bouncy w-full bg-blue-500 hover:bg-blue-600 text-white text-xl font-black py-4 rounded-2xl shadow-[0_6px_0_#1e3a8a] border-2 border-blue-800">
                        Confirmar y Avanzar ➡️
                    </button>
                `;
            }
        }

        function checkTestAnswer(type, selectedOpt = null, correctOpt = null) {
            let isCorrect = false;

            if (type === 'measure') {
                if (selectedOpt === correctOpt) isCorrect = true;
            } else if (type === 'math') {
                const in1 = parseInt(document.getElementById('test-math-1').value);
                const inOp = document.getElementById('test-math-op').value;
                const in2 = parseInt(document.getElementById('test-math-2').value);
                const inRes = parseInt(document.getElementById('test-math-res').value);

                if (isNaN(in1) || isNaN(in2) || isNaN(inRes) || inOp === '?') {
                    showModal('¡Faltan datos!', 'Completa todos los casilleros antes de avanzar a la siguiente pregunta.', '⚠️', 'border-yellow-400');
                    return; 
                }

                let isExpressionCorrect = false;
                if (currentMathState.op === '+') {
                    if (inOp === '+' && ((in1 === currentMathState.n1 && in2 === currentMathState.n2) || (in1 === currentMathState.n2 && in2 === currentMathState.n1))) {
                        isExpressionCorrect = true;
                    }
                } else {
                    if (inOp === '-' && in1 === currentMathState.n1 && in2 === currentMathState.n2) {
                        isExpressionCorrect = true;
                    }
                }

                const isResultCorrect = (inRes === currentMathState.ans);
                if (isExpressionCorrect && isResultCorrect) isCorrect = true;
            }

            if (isCorrect) {
                testCorrectAnswers++;
            }
            
            // Avanzar automáticamente sin indicar si fue correcta o incorrecta (formato evaluación)
            currentTestIndex++;
            loadTestQuestion();
        }

        function finishTest() {
            hideAllScreens();
            document.getElementById('screen-test-result').classList.remove('hidden');
            document.getElementById('screen-test-result').classList.add('flex');
            
            document.getElementById('test-final-score').innerText = testCorrectAnswers;
            
            // Calcular nota en escala chilena (1.0 a 7.0, exigencia 60%)
            // Puntaje máximo: 10 pts, Aprobación (4.0) a los 6 pts.
            let nota = 1.0;
            if (testCorrectAnswers < 6) {
                nota = 3 * (testCorrectAnswers / 6) + 1;
            } else {
                nota = 3 * ((testCorrectAnswers - 6) / 4) + 4;
            }
            
            // Redondear a 1 decimal
            nota = Math.round(nota * 10) / 10;
            
            const gradeEl = document.getElementById('test-final-grade');
            gradeEl.innerText = nota.toFixed(1);
            
            // Estilos según si aprueba o reprueba
            if (nota >= 4.0) {
                gradeEl.className = "text-7xl font-black text-blue-600";
                document.getElementById('test-result-emoji').innerText = "🥳";
                shootConfetti();
            } else {
                gradeEl.className = "text-7xl font-black text-red-500";
                document.getElementById('test-result-emoji').innerText = "💪";
            }
            
            document.getElementById('test-progress-bar').style.width = '100%';
        }

        function generateMathProblem() {
            // Limpiar inputs
            document.getElementById('math-input-1').value = '';
            document.getElementById('math-operator').value = '?';
            document.getElementById('math-input-2').value = '';
            document.getElementById('math-result').value = '';

            const isAddition = Math.random() > 0.5;
            let num1, num2, result;
            const theme = mathThemes[Math.floor(Math.random() * mathThemes.length)];
            let text = "";

            if (isAddition) {
                // Generar suma con reserva (unidades suman > 9)
                do {
                    num1 = Math.floor(Math.random() * 50) + 15;
                    num2 = Math.floor(Math.random() * 40) + 15;
                } while ((num1 % 10) + (num2 % 10) <= 9 || (num1 + num2) > 100);
                
                result = num1 + num2;
                text = `Tienes ${num1} ${theme.item}. Un amigo ${theme.verbAdd} ${num2} más. ¿Cuántos ${theme.item} tienes en total?`;
                currentMathState = { n1: num1, n2: num2, op: '+', ans: result };
            } else {
                // Generar resta con canje (unidad n1 < unidad n2)
                do {
                    num1 = Math.floor(Math.random() * 50) + 30; // Min 30
                    num2 = Math.floor(Math.random() * 25) + 15; // Min 15
                } while ((num1 % 10) >= (num2 % 10) || num1 <= num2);

                result = num1 - num2;
                text = `Tenías ${num1} ${theme.item}. Luego, ${theme.verbSub} ${num2}. ¿Cuántos ${theme.item} te quedan ahora?`;
                currentMathState = { n1: num1, n2: num2, op: '-', ans: result };
            }

            document.getElementById('math-problem-text').innerText = text;
        }

        function checkMath() {
            const in1 = parseInt(document.getElementById('math-input-1').value);
            const inOp = document.getElementById('math-operator').value;
            const in2 = parseInt(document.getElementById('math-input-2').value);
            const inRes = parseInt(document.getElementById('math-result').value);

            if (isNaN(in1) || isNaN(in2) || isNaN(inRes) || inOp === '?') {
                showModal('¡Ups!', 'Por favor, completa todos los casilleros de la expresión matemática.', '🤔', 'border-yellow-400');
                return;
            }

            // Comprobar si la expresión está armada correctamente
            // Permitimos n1+n2 o n2+n1 en sumas. Restas deben ser estrictas.
            let isExpressionCorrect = false;
            
            if (currentMathState.op === '+') {
                if (inOp === '+' && ((in1 === currentMathState.n1 && in2 === currentMathState.n2) || (in1 === currentMathState.n2 && in2 === currentMathState.n1))) {
                    isExpressionCorrect = true;
                }
            } else {
                if (inOp === '-' && in1 === currentMathState.n1 && in2 === currentMathState.n2) {
                    isExpressionCorrect = true;
                }
            }

            const isResultCorrect = (inRes === currentMathState.ans);

            if (isExpressionCorrect && isResultCorrect) {
                shootConfetti();
                updateScore(10);
                showModal('¡Excelente!', '¡Armaste muy bien la expresión y la respuesta es correcta! Ganaste 10 estrellas.', '🌟', 'border-green-400', generateMathProblem);
            } else if (!isExpressionCorrect && isResultCorrect) {
                showModal('¡Casi, casi!', 'El resultado está bien, pero revisa cómo armaste la expresión (los números o el signo).', '👀', 'border-yellow-400');
            } else if (isExpressionCorrect && !isResultCorrect) {
                showModal('Expresión correcta', '¡Pusiste muy bien los números! Pero el resultado no es ese. Intenta calcular de nuevo.', '✏️', 'border-yellow-400');
            } else {
                showModal('¡Inténtalo de nuevo!', 'Lee bien el problema para armar los números y elige si es suma o resta.', '💪', 'border-blue-400');
            }
        }

        function generateMeasureQuestion() {
            // Seleccionar pregunta aleatoria
            const qObj = measureQuestions[Math.floor(Math.random() * measureQuestions.length)];
            currentMeasureState = qObj;

            document.getElementById('measure-question-text').innerText = qObj.q;
            
            const emojiCont = document.getElementById('measure-image-container');
            const emojiEl = document.getElementById('measure-emoji');
            if (qObj.emoji) {
                emojiCont.classList.remove('hidden');
                emojiEl.innerText = qObj.emoji;
            } else {
                emojiCont.classList.add('hidden');
            }

            // Mezclar opciones
            const shuffledOptions = [...qObj.options].sort(() => Math.random() - 0.5);
            
            const optionsContainer = document.getElementById('measure-options');
            optionsContainer.innerHTML = ''; // Limpiar anteriores

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-bouncy w-full bg-slate-100 hover:bg-purple-100 text-slate-700 font-bold py-4 px-6 rounded-2xl border-4 border-slate-300 hover:border-purple-400 text-lg sm:text-xl transition-colors';
                btn.innerText = opt;
                btn.onclick = () => checkMeasure(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function checkMeasure(selectedAnswer) {
            if (selectedAnswer === currentMeasureState.answer) {
                shootConfetti();
                updateScore(5);
                showModal('¡Muy bien hecho!', '¡Respuesta correcta! Ganaste 5 estrellas.', '🎉', 'border-green-400', generateMeasureQuestion);
            } else {
                showModal('¡Casi!', 'Esa no es la respuesta correcta. ¡Inténtalo otra vez, tú puedes!', '💪', 'border-yellow-400');
            }
        }

        let modalCallback = null;

        function showModal(title, message, icon, borderClass, callback = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            
            const content = document.getElementById('modal-content');
            content.className = `bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center border-8 transform scale-100 transition-transform duration-300 ${borderClass}`;
            
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
            
            modalCallback = callback;
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-overlay').classList.remove('flex');
            if (modalCallback) {
                modalCallback();
                modalCallback = null;
            }
        }

        function shootConfetti() {
            for (let i = 0; i < 30; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = ['#fbbf24', '#34d399', '#60a5fa', '#f87171', '#c084fc'][Math.floor(Math.random() * 5)];
                conf.style.animationDuration = (Math.random() * 1 + 1) + 's';
                document.body.appendChild(conf);
                
                setTimeout(() => {
                    conf.remove();
                }, 2000);
            }
        }
    </script>
</body>
</html>
