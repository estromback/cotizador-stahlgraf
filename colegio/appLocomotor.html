    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.1);
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(146.83, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const oscWin = ctx.createOscillator();
            const gainWin = ctx.createGain();
            oscWin.connect(gainWin);
            gainWin.connect(ctx.destination);
            oscWin.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
            gainWin.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.12);
            gainWin.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.25);
            oscWin.start(ctx.currentTime + idx * 0.12);
            oscWin.stop(ctx.currentTime + idx * 0.12 + 0.25);
          });
        }
      } catch (e) {}
    };

    const shuffleArray = (array) => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    const calculateGrade = (score, total) => {
      if (total === 0) return "1.0";
      const percentage = score / total;
      let grade;
      if (percentage < 0.6) {
        grade = 1.0 + (percentage / 0.6) * 3.0;
      } else {
        grade = 4.0 + ((percentage - 0.6) / 0.4) * 3.0;
      }
      return grade.toFixed(1);
    };

    function App() {
      const [activeTab, setActiveTab] = React.useState('summary');
      const [selectedBodyPart, setSelectedBodyPart] = React.useState('biceps');

      // Quiz State
      const [quizStarted, setQuizStarted] = React.useState(false);
      const [currentQuestions, setCurrentQuestions] = React.useState([]);
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const [userAnswers, setUserAnswers] = React.useState([]);
      const [selectedOption, setSelectedOption] = React.useState(null);
      const [quizCompleted, setQuizCompleted] = React.useState(false);
      const [score, setScore] = React.useState(0);

      const startQuiz = (questionCount = 50) => {
        let pool = shuffleArray(MASTER_QUESTIONS);
        let selected = pool.slice(0, Math.min(questionCount, pool.length));

        const formatted = selected.map((q) => {
          const originalOpts = q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.answer }));
          const shuffledOpts = shuffleArray(originalOpts);
          const newCorrectIdx = shuffledOpts.findIndex(o => o.isCorrect);
          return {
            question: q.question,
            options: shuffledOpts.map(o => o.text),
            answer: newCorrectIdx,
            explanation: q.explanation
          };
        });

        setCurrentQuestions(formatted);
        setCurrentIndex(0);
        setUserAnswers([]);
        setSelectedOption(null);
        setQuizCompleted(false);
        setScore(0);
        setQuizStarted(true);
      };

      const handleOptionSelect = (optIdx) => {
        if (selectedOption !== null) return;

        setSelectedOption(optIdx);
        const isCorrect = optIdx === currentQuestions[currentIndex].answer;

        if (isCorrect) {
          playSound('correct');
          setScore(prev => prev + 1);
        } else {
          playSound('wrong');
        }

        const newAnswers = [...userAnswers, {
          questionIdx: currentIndex,
          selected: optIdx,
          correct: currentQuestions[currentIndex].answer,
          isCorrect
        }];
        setUserAnswers(newAnswers);

        setTimeout(() => {
          if (currentIndex + 1 < currentQuestions.length) {
            setCurrentIndex(prev => prev + 1);
            setSelectedOption(null);
          } else {
            setQuizCompleted(true);
            playSound('win');
          }
        }, 1100);

                <div className="bg-purple-50 p-4 rounded-2xl border border-purple-200">
                  <div className="flex items-center gap-2 mb-2">
                    <span className="text-3xl">🦶</span>
                    <h3 className="font-fun text-lg text-purple-900">Ponerse de Puntas</h3>
                  </div>
                  <div className="space-y-1 text-xs text-slate-800">
                    <p className="bg-white p-2 rounded-lg"><strong>💪 Músculos:</strong> Gemelos.</p>
                    <p className="bg-white p-2 rounded-lg"><strong>⚙️ Articulaciones:</strong> Tobillo.</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {}
          {activeTab === 'quiz' && (
            <div className="bg-white p-6 rounded-3xl shadow-sm border border-purple-100">
              {!quizStarted ? (
                <div className="text-center py-8 max-w-md mx-auto space-y-5">
                  <div className="w-20 h-20 bg-purple-100 text-purple-600 rounded-3xl flex items-center justify-center text-4xl mx-auto shadow-inner">
                    ⚡
                  </div>
                  <div>
                    <h2 className="text-3xl font-fun text-slate-800">Súper Quiz de 50 Preguntas</h2>
                    <p className="text-xs text-slate-600 mt-1">
                      Preguntas aleatorias de alternativa cada partida con calificación automática en escala chilena.
                    </p>
                  </div>

                  <div className="space-y-3 pt-2">
                    <button
                      onClick={() => startQuiz(50)}
                      className="w-full py-4 bg-purple-600 hover:bg-purple-700 text-white font-fun text-lg rounded-2xl shadow-lg shadow-purple-200 transition-all transform hover:scale-[1.01]"
                    >
                      🚀 Comenzar Quiz de 50 Preguntas
                    </button>
                    <button
                      onClick={() => startQuiz(15)}
                      className="w-full py-3 bg-purple-100 hover:bg-purple-200 text-purple-800 font-fun text-sm rounded-2xl transition-all"
                    >
                      ⏱️ Modo Rápido (15 Preguntas)
                    </button>
                  </div>
                </div>
              ) : quizCompleted ? (
                <div className="space-y-6 py-2">
                  <div className="bg-gradient-to-br from-purple-600 to-indigo-700 text-white p-6 rounded-3xl text-center space-y-3 shadow-xl">
                    <span className="text-5xl">🏆</span>
                    <h2 className="text-3xl font-fun">¡Quiz Completado!</h2>
                    
                    <div className="flex justify-center items-center gap-6 my-2">
                      <div className="bg-white/20 backdrop-blur-md px-5 py-2.5 rounded-2xl border border-white/30">
                        <span className="text-[11px] uppercase tracking-wider block text-purple-200">Puntaje</span>
                        <span className="text-2xl font-extrabold">{score} / {currentQuestions.length}</span>
                      </div>

                      <div className="bg-white/20 backdrop-blur-md px-5 py-2.5 rounded-2xl border border-white/30">
                        <span className="text-[11px] uppercase tracking-wider block text-purple-200">Nota Estimada</span>
                        <span className="text-2xl font-extrabold text-yellow-300">
                          {calculateGrade(score, currentQuestions.length)}
                        </span>
                      </div>
                    </div>

                    <button
                      onClick={() => startQuiz(currentQuestions.length)}
                      className="px-5 py-2.5 bg-white text-purple-700 font-fun font-bold rounded-xl shadow hover:bg-purple-50 transition-all text-sm"
                    >
                      🔄 Probar otro Quiz Aleatorio
                    </button>
                  </div>

                  {/* Review Answers */}
                  <div className="space-y-3">
                    <h3 className="font-fun text-lg text-slate-800">Revisión de Preguntas</h3>
                    <div className="space-y-2 max-h-[400px] overflow-y-auto pr-1">
                      {userAnswers.map((ans, idx) => {
                        const q = currentQuestions[ans.questionIdx];
                        return (
                          <div
                            key={idx}
                            className={`p-3 rounded-2xl border text-xs ${
                              ans.isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-red-50 border-red-200'
                            }`}
                          >
                            <div className="flex items-center justify-between mb-1">
                              <span className="font-bold text-slate-700">P{idx + 1}</span>
                              <span className={`font-bold px-2 py-0.5 rounded text-[10px] ${
                                ans.isCorrect ? 'bg-emerald-200 text-emerald-800' : 'bg-red-200 text-red-800'
                              }`}>
                                {ans.isCorrect ? 'Correcta ✓' : 'Incorrecta ✗'}
                              </span>
                            </div>
                            <p className="font-semibold text-slate-800 mb-1">{q.question}</p>
                            <p className="text-slate-600">
                              Tu respuesta: <strong className={ans.isCorrect ? 'text-emerald-700' : 'text-red-700'}>{q.options[ans.selected]}</strong>
                            </p>
                            {!ans.isCorrect && (
                              <p className="text-emerald-700 font-medium mt-0.5">
                                Correcta: <strong>{q.options[q.answer]}</strong>
                              </p>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              ) : (
                <div className="space-y-5">
                  <div className="flex items-center justify-between text-xs font-bold text-slate-600">
                    <span>Pregunta {currentIndex + 1} de {currentQuestions.length}</span>
                    <span className="text-purple-600">Correctas: {score}</span>
                  </div>

                  <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                    <div
                      className="h-full bg-purple-600 transition-all duration-300"
                      style={{ width: `${((currentIndex + 1) / currentQuestions.length) * 100}%` }}
                    ></div>
                  </div>

                  <div className="bg-purple-50/60 p-5 rounded-2xl border border-purple-100">
                    <h3 className="font-fun text-lg md:text-xl text-slate-800">
                      {currentQuestions[currentIndex].question}
                    </h3>
                  </div>

                  <div className="grid grid-cols-1 gap-2.5">
                    {currentQuestions[currentIndex].options.map((optText, optIdx) => {
                      let btnStyle = "bg-white border-slate-200 hover:border-purple-300 text-slate-700";

                      if (selectedOption !== null) {
                        if (optIdx === currentQuestions[currentIndex].answer) {
                          btnStyle = "bg-emerald-500 border-emerald-600 text-white font-bold shadow";
                        } else if (optIdx === selectedOption) {
                          btnStyle = "bg-red-500 border-red-600 text-white font-bold";
                        } else {
                          btnStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                        }
                      }

                      return (
                        <button
                          key={optIdx}
                          disabled={selectedOption !== null}
                          onClick={() => handleOptionSelect(optIdx)}
                          className={`w-full p-3.5 rounded-2xl border-2 text-left text-xs md:text-sm font-semibold transition-all flex items-center justify-between ${btnStyle}`}
                        >
                          <span>{optText}</span>
                          {selectedOption !== null && optIdx === currentQuestions[currentIndex].answer && (
                            <i className="fa-solid fa-circle-check text-base"></i>
                          )}
                          {selectedOption !== null && optIdx === selectedOption && optIdx !== currentQuestions[currentIndex].answer && (
                            <i className="fa-solid fa-circle-xmark text-base"></i>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}

          {}
          <footer className="mt-8 text-center text-xs text-slate-500">
            <p><strong>App de Estudio para 4° Básico - Sistema Locomotor</strong></p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
