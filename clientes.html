<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stahlgraf - Directorio de Clientes</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    <style>
        body { margin: 0; padding: 0; min-height: 100vh; }
        
        .client-manager-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .search-bar-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .client-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .client-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .client-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .client-info h3 {
            margin: 0 0 12px 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #e2e8f0;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 500;
            width: 80px;
            flex-shrink: 0;
        }

        .client-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
        }

        .modal-body .input-group {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" style="display: flex; align-items: center; gap: 15px; text-decoration: none; transition: opacity 0.2s;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">
                <img src="logo.png" alt="Stahlgraf Logo" style="height: 120px; object-fit: contain;" onerror="this.style.display='none'">
                <h1 class="logo" style="margin: 0;"> <span>Directorio</span></h1>
            </a>
            <div class="nav-actions" style="display: flex; gap: 10px; align-items: center;">
                <button id="btn-sync-login" class="btn btn-primary-outline" style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; padding: 6px 12px;">
                    <span id="sync-icon">☁️</span>
                    <span id="sync-text">Ingresar para Sync</span>
                </button>
                <button id="btn-add-client" class="btn btn-primary">+ Agregar Cliente</button>
            </div>
        </div>
    </nav>

    <div class="client-manager-container">
        <div class="search-bar-row">
            <input type="text" id="client-search" class="search-input" placeholder="Buscar por nombre, dirección o teléfono...">
            <span style="color:#666;" id="client-count">0 clientes en total</span>
        </div>

        <div class="client-list-grid" id="client-list-container">
            <!-- Injected dynamically by JS -->
        </div>
    </div>

    <!-- Edit/Add Client Modal -->
    <div id="client-modal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 500px;">
            <div class="modal-header">
                <h2 id="modal-title">Nuevo Cliente</h2>
                <button id="btn-close-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-client-id">
                <div class="input-group">
                    <label>Nombre / Razón Social</label>
                    <input type="text" id="client-name" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="input-group">
                    <label>Persona de Contacto / Atención</label>
                    <input type="text" id="client-attention" placeholder="Ej. Administración / Juan">
                </div>
                <div class="input-group">
                    <label>Teléfono</label>
                    <input type="tel" id="client-phone" placeholder="Ej. +56 9 1234 5678" required>
                </div>
                <div class="input-group">
                    <label>Dirección</label>
                    <input type="text" id="client-address" placeholder="Ej. Av. Matta 450, Santiago" required>
                </div>
                <div class="flex-actions" style="margin-top: 25px;">
                    <button id="btn-save-client" class="btn btn-primary">Guardar Cliente</button>
                </div>
            </div>
        </div>
    </div>

    <script src="clientes.js"></script>
</body>
</html>
